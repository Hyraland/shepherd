<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>在伊犁草原放羊（开发版）</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #a9cbee;
    -webkit-user-select: none; user-select: none;
  }
  #c {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: grab;
  }
  #c.dragging { cursor: grabbing; }
  #veil {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: #fbf6ea; transition: opacity 2.2s ease;
  }
  #veil.gone { opacity: 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"></div>
<script>
  // 开发版：调节面板（G 显示 / 隐藏）、数字键 1–3 / M 切换小羊模型、控制台里的 window.__yili
  window.YILI_DEV = true;
</script>
<script type="module">
  // 防缓存
  const base = `./v${Date.now()}/`;
  // 只用于本地开发
  const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
  const ok = local && await fetch(`${base}src/main.js`, { method: 'HEAD', cache: 'no-store' }).then((r) => r.ok).catch(() => false);
  await import(`${ok ? base : './'}src/main.js`);
</script>
</body>
</html>
